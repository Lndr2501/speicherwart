name: Speicherwart
options:
  bundleIdPrefix: ch.semlitsch
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PKK5ZQ9PNH
    ENABLE_HARDENED_RUNTIME: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  Speicherwart:
    type: application
    platform: macOS
    sources:
      - path: Speicherwart
    dependencies:
      - target: SpeicherwartWidget
        embed: true
        codeSign: false
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.semlitsch.speicherwart
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Speicherwart
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ENABLE_APP_SANDBOX: NO
  SpeicherwartWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Speicherwart/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.semlitsch.speicherwart.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Widget-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Speicherwart
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
